settings:
  # Log state changes to the console.
  debug-mode: false
  # Minimum seconds between two view refreshes for one player. A refresh asked for sooner is
  # delayed until the cooldown ends, never skipped.
  refresh-cooldown-seconds: 1

worlds:
  # Worlds where protection applies (exact, case-sensitive names).
  # The Nether, the End and creative worlds rarely need it.
  whitelist:
    - world
    - mining_world

antixray:
  # Players at or above this Y count as "above ground".
  protection-y-level: 31.0
  # Blocks and entities at or below this Y are hidden from above-ground players.
  hide-below-y: 16
  # Above-ground players get the full view back only this many blocks under protection-y-level,
  # so jumping around on a ledge doesn't make the view flicker.
  hysteresis: 2.0
  # Players under protection-y-level still don't get terrain more than this many blocks below
  # themselves (rounded to 16-block sections). Stops "dig a shaft to Y 30 and look down". 0 = off.
  underground-view-depth: 48

entities:
  # Hide listed entities (and players) that are below the hidden level.
  hide-entities: true
  # Hide listed entities (and players) from anyone who can't see them through solid blocks,
  # so ESP / wallhack clients don't learn where they are. Glass and leaves don't block sight.
  # Spectators and players with antifreecam.bypass see everything.
  line-of-sight:
    enabled: true
    # How often each player's view is re-checked, in ticks (20 ticks = 1 second).
    check-interval-ticks: 2
    # Entities this close are always shown.
    always-visible-distance: 3
    # Entities farther than this aren't checked.
    max-distance: 64
  # Entity types hidden while underground. Players are always hidden.
  hidden-types:
    - ARMOR_STAND
    - ITEM_FRAME
    - GLOW_ITEM_FRAME
    - PAINTING
    - MINECART
    - CHEST_MINECART
    - HOPPER_MINECART
    - TNT_MINECART
    - FURNACE_MINECART
    - SPAWNER_MINECART
    - ZOMBIE
    - SKELETON
    - CREEPER
    - SPIDER
    - CAVE_SPIDER
    - ENDERMAN
    - WITCH
    - SLIME
    - MAGMA_CUBE
    - SILVERFISH
    - ENDERMITE
    - GUARDIAN
    - ELDER_GUARDIAN
    - SHULKER
    - PHANTOM
    - DROWNED
    - HUSK
    - STRAY
    - ZOMBIE_VILLAGER
    - PILLAGER
    - VINDICATOR
    - EVOKER
    - VEX
    - RAVAGER
    - HOGLIN
    - ZOGLIN
    - PIGLIN
