performance:
  # Master switch for hiding.
  underground-protection:
    enabled: true
  # Chunks re-sent per tick during a view refresh.
  max-chunks-per-tick: 50
  # Cap the refresh radius (in chunks) below the server view distance.
  limited-area:
    enabled: false
    chunk-radius: 3
  replacement:
    # What hidden blocks look like, e.g. air, stone, deepslate.
    block-type: "air"

advanced:
  packet-processing:
    modify-chunk-data: true
    modify-block-changes: true
    modify-multi-block-changes: true
    # Also hide what gives away hidden areas: light (torches, lava), biomes (deep dark),
    # block entities (chests, spawners), block events, mining cracks, sounds and particles.
    strip-side-channels: true

bedrock:
  enabled: true
  detection:
    use-geyser-api: true
    use-floodgate-api: true
    use-uuid-pattern: true
    use-name-prefix: true
    name-prefixes:
      - "."
  optimizations:
    # Bedrock players get a smaller refresh radius.
    chunk-radius-reduction: 1
    minimum-chunk-radius: 2
  logging:
    log-detection: true
    log-detection-method: false
