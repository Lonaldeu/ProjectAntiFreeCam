performance:
  # Master switch for hiding.
  underground-protection:
    enabled: true
  # Chunks re-sent per tick and player during a view refresh or a cave-occlusion reveal (Paper
  # itself sends about 4).
  max-chunks-per-tick: 8
  replacement:
    # What hidden blocks look like, e.g. air, stone, deepslate.
    block-type: "air"

advanced:
  packet-processing:
    # Also hide what gives away hidden areas: light (torches, lava), biomes (deep dark),
    # block entities (chests, spawners), block events, mining cracks, explosions, sounds and particles.
    strip-side-channels: true
